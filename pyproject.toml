[tool.ruff.lint]
# Enable standard Pyflakes and pycodestyle rules
select = ["E", "F", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in init files
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = [
    "tests",
]
pythonpath = ["."]
